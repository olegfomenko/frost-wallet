name: Build

# Builds the single-file page on every commit and keeps it as a downloadable
# artifact. Commits to the default branch are also published to GitHub Pages.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain and the wasm32 target are pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Exactly the versions recorded in package-lock.json.
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build page
        run: npm run build

      - name: Upload page
        uses: actions/upload-artifact@v7
        with:
          name: frost-wallet
          path: dist/frost-wallet.html
          if-no-files-found: error

      # GitHub Pages serves index.html at the site root.
      - name: Prepare Pages site
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          mkdir site
          cp dist/frost-wallet.html site/index.html
          cp dist/frost-wallet.html site/frost-wallet.html
          sha256sum dist/frost-wallet.html | tee site/SHA256SUMS.txt

      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
