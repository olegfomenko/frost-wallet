[package]
name = "frost-wallet-core"
description = "Offline FROST wallet core: ChillDKG + FROST signing behind a JSON API, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chilldkg-rs = "0.5"
k256 = { version = "0.13", features = ["alloc", "arithmetic"], default-features = false }
sha2 = { version = "0.11", default-features = false }
zeroize = "1"
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
getrandom = "0.2"
hex = "0.4"
